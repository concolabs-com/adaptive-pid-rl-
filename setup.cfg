[flake8]
max-line-length = 120
# E203/W503: black compatibility. E402: module-level imports after
# matplotlib.use("Agg") and sys.path.insert are intentional in scripts.
ignore = E203, W503, E402
exclude =
    venv,
    __pycache__,
    .claude,
    .git
per-file-ignores =
    __init__.py: F401

[isort]
profile = black
line_length = 120
